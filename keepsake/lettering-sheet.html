<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lettering sheet</title>
<link rel="stylesheet" href="/src/fonts.css"><link rel="stylesheet" href="/src/lettering.css">
<style>body{margin:0;background:#efe4cf;font-family:Inter,sans-serif;padding:24px;--font-display:"Fraunces",serif;--font-script:"Caveat",cursive}
.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:16px;padding:10px 0;border-bottom:1px dashed #c9b894}.row b{font:600 14px Inter}
.s{font-size:54px}</style></head><body>
<div class="row"><b>handwritten</b><span class="s" style="font-family:var(--font-script);color:#2c2418">Summer 2004</span></div>
<div class="row"><b>chrome</b><span class="s ks-look ks-look-chrome">Summer 2004</span></div>
<div class="row"><b>glow</b><span class="s ks-look ks-look-glow">Summer 2004</span></div>
<div class="row"><b>rhinestone</b><span class="s ks-look ks-look-rhinestone">Summer 2004</span></div>
<div class="row"><b>bubble</b><span class="s ks-look ks-look-bubble">Summer 2004</span></div>
<div class="row"><b>fire</b><span class="s ks-look ks-look-fire">Summer 2004</span></div>
<div class="row"><b>ice</b><span class="s ks-look ks-look-ice">Summer 2004</span></div>
</body></html>
