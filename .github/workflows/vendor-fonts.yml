name: Vendor fonts

# One-off job: downloads the typefaces from the npm registry, copies them into
# keepsake/public/fonts, writes keepsake/src/fonts.css and commits the result
# to the branch. Runs when .github/requests/vendor-fonts is changed on a codex/
# branch (workflow_dispatch only works for workflows already on the default branch).
on:
  push:
    branches: ['codex/**']
    paths: ['.github/requests/vendor-fonts']

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # keep the write token out of .git/config while third-party installs run
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the font packages
        run: |
          mkdir "$RUNNER_TEMP/fonts" && cd "$RUNNER_TEMP/fonts"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @fontsource-variable/inter @fontsource-variable/fraunces @fontsource-variable/caveat
      - name: Copy fonts and write fonts.css
        run: bash .github/scripts/run-step.sh vendor-fonts node .github/scripts/vendor-fonts.mjs "$RUNNER_TEMP/fonts" keepsake
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepsake/public/fonts keepsake/src/fonts.css
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Vendor Inter, Fraunces and Caveat (self-hosted fonts)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
